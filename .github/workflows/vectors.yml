name: Vectors

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Each vector file is the output of its generator. This fails if a file was edited by hand, or
  # if a generator changed without its file being regenerated. The generators also check their
  # primitives against published RFC vectors before computing anything.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cryptography>=42"
      - run: python3 vectors/tools/unicast.py check
      - run: python3 vectors/tools/first_contact.py check
      - run: python3 vectors/tools/phy.py check
      - run: python3 vectors/tools/routing.py check
      - run: python3 vectors/tools/forwarding.py check
      - run: python3 vectors/tools/companion.py check
      # Analyses whose tables are generated: fails if a table no longer matches its script. Each
      # script also checks itself against published values first.
      - run: python3 analysis/first_contact_fit.py check
